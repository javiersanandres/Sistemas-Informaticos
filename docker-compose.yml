services:
  api:
    build:
      context: ./api_server
      dockerfile: ./Dockerfile
    ports:
      - "127.0.0.1:5015:5000"
    env_file:
      - ./api_server/.env
    command: python api.py
    depends_on:
      - db1

  db1:
    image: postgres:14.8
    restart: on-failure
    environment:
      - POSTGRES_PASSWORD=1234
      - POSTGRES_DB=si1
      - POSTGRES_USER=alumnodb
    ports:
      - "127.0.0.1:5005:5432"
    volumes:
      - ./db_files/db_1/dump_p2_v1.sql.gz:/docker-entrypoint-initdb.d/1_data.sql.gz

  db2:
    image: postgres:14.8
    restart: on-failure
    environment:
      - POSTGRES_PASSWORD=1234
      - POSTGRES_DB=si1
      - POSTGRES_USER=alumnodb
    ports:
      - "127.0.0.1:5010:5432"
    volumes:
      - ./db_files/db_2/dump_p2_v2.sql.gz:/docker-entrypoint-initdb.d/2_data.sql.gz
volumes:
  db1-data:
  db2-data:
